<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tree Guide – Victoria (test)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{--bg:#fff;--fg:#1d2a1f;--muted:#5d6b60;--line:#dfe6e0;--accent:#2f6b3a}
  @media (prefers-color-scheme:dark){:root{--bg:#141a15;--fg:#e8efe9;--muted:#9bab9f;--line:#2a352c;--accent:#7fc58b}}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;height:100dvh}
  header{padding:8px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;flex:1}
  button,select{font:inherit;padding:6px 10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px}
  button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  #map{flex:1;min-height:200px}
  #list{height:38vh;overflow:auto;border-top:1px solid var(--line)}
  #status{padding:6px 16px;color:var(--muted);font-size:13px}
  .t{padding:8px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;cursor:pointer}
  .t b{display:block}.t small{color:var(--muted)}
  .d{margin-left:auto;white-space:nowrap;color:var(--accent);font-weight:600}
  .dot{width:12px;height:12px;border-radius:50%;margin-top:4px;flex:none}
</style>
</head>
<body>
<header>
  <h1>🌳 Trees near you</h1>
  <button id="follow">Follow my GPS</button>
  <select id="radius"><option value="50">50 m</option><option value="100" selected>100 m</option><option value="250">250 m</option></select>
</header>
<div id="status">Loading trees…</div>
<div id="map"></div>
<div id="list"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
const COLORS={'Deciduous':'#d98c1f','Conifer':'#1f6b3a','Mixed / other':'#8a5ca8'};
const map=L.map('map').setView([48.4117,-123.3647],16);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const layer=L.layerGroup().addTo(map), canvas=L.canvas();
let trees=[], me=null, meMarker=null, ring=null, watchId=null;

const $=id=>document.getElementById(id);
const status=t=>$('status').textContent=t;

function dist(a,b,c,d){ // metres, equirectangular – fine for short range
  const x=(d-b)*Math.PI/180*Math.cos((a+c)/2*Math.PI/180), y=(c-a)*Math.PI/180;
  return Math.sqrt(x*x+y*y)*6371000;
}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function update(){
  if(!me) return;
  const r=+$('radius').value;
  const near=[];
  for(const t of trees){
    if(Math.abs(t.lat-me[0])>0.003) continue;           // cheap pre-filter
    const d=dist(me[0],me[1],t.lat,t.lon);
    if(d<=r) near.push({t,d});
  }
  near.sort((a,b)=>a.d-b.d);
  layer.clearLayers();
  const list=$('list'); list.innerHTML='';
  near.slice(0,300).forEach(({t,d},i)=>{
    const c=COLORS[t.colour]||'#666';
    L.circleMarker([t.lat,t.lon],{renderer:canvas,radius:6,color:'#fff',weight:1,fillColor:c,fillOpacity:.95})
      .bindPopup(popup(t,d)).addTo(layer);
    if(i<50){
      const el=document.createElement('div'); el.className='t';
      el.innerHTML=`<span class="dot" style="background:${c}"></span><div><b>${esc(t.name||'Unknown')}</b><small><i>${esc(t.latin)}</i>${t.where?' · '+esc(t.where):''}</small></div><span class="d">${Math.round(d)} m</span>`;
      el.onclick=()=>map.setView([t.lat,t.lon],19);
      list.appendChild(el);
    }
  });
  if(!near.length) list.innerHTML='<div class="t"><div>No trees within this radius.</div></div>';
  status(`${near.length} tree${near.length===1?'':'s'} within ${r} m · ${trees.length.toLocaleString()} loaded`);
}
function popup(t,d){
  return `<b>${esc(t.name)}</b><br><i>${esc(t.latin)}</i><br>${esc(t.type)}<br>`+
    `Trunk ${esc(t.trunk||'?')} cm · Height ${esc(t.height||'?')} m<br>${esc(t.where)}${t.hood?' ('+esc(t.hood)+')':''}<br>${Math.round(d)} m away`;
}
function setMe(lat,lon,pan){
  me=[lat,lon];
  if(!meMarker){
    meMarker=L.circleMarker(me,{radius:9,color:'#fff',weight:3,fillColor:'#1a73e8',fillOpacity:1}).addTo(map);
    ring=L.circle(me,{radius:+$('radius').value,color:'#1a73e8',weight:1,fillOpacity:.04}).addTo(map);
  } else { meMarker.setLatLng(me); ring.setLatLng(me); }
  ring.setRadius(+$('radius').value);
  if(pan) map.setView(me,Math.max(map.getZoom(),18));
  update();
}

$('radius').onchange=()=>{ if(ring) ring.setRadius(+$('radius').value); update(); };
map.on('click',e=>{ if(watchId===null) setMe(e.latlng.lat,e.latlng.lng,false); });  // tap map to simulate position

$('follow').onclick=()=>{
  if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; $('follow').classList.remove('on'); $('follow').textContent='Follow my GPS'; return; }
  if(!navigator.geolocation){ status('GPS not supported in this browser.'); return; }
  let first=true;
  watchId=navigator.geolocation.watchPosition(
    p=>{ setMe(p.coords.latitude,p.coords.longitude,first); first=false; },
    e=>{ status('GPS error: '+e.message+' – you can still tap the map to set a spot.'); },
    {enableHighAccuracy:true,maximumAge:2000,timeout:20000});
  $('follow').classList.add('on'); $('follow').textContent='Following… (tap to stop)';
};

Papa.parse('data/victoria.csv',{download:true,header:true,skipEmptyLines:true,worker:false,
  complete:r=>{
    trees=r.data.map(x=>({name:x['Name'],latin:x['Latin name'],type:x['Tree type'],colour:x['Map colour'],
      where:x['Where'],hood:x['Neighbourhood'],trunk:x['Trunk width cm'],height:x['Height m'],
      lat:parseFloat(x['Latitude']),lon:parseFloat(x['Longitude'])}))
      .filter(t=>isFinite(t.lat)&&isFinite(t.lon));
    status(`${trees.length.toLocaleString()} trees loaded. Tap “Follow my GPS”, or tap the map to try a spot.`);
  },
  error:e=>status('Could not load data/victoria.csv: '+e)});
</script>
</body>
</html>
